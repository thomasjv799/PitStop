{# The PitStop mark: a dial whose hands read as an expiry clock. #}
{% macro mark(size=22, stroke=2, accent='#b5abfc', hand='#e9e9ed') -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 40 40" fill="none" aria-hidden="true">
  <circle cx="20" cy="20" r="17" stroke="{{ accent }}" stroke-width="{{ stroke }}"></circle>
  <path d="M20 20 L20 6" stroke="{{ accent }}" stroke-width="{{ stroke }}" stroke-linecap="round"></path>
  <path d="M20 20 L31 27" stroke="{{ hand }}" stroke-width="{{ stroke }}" stroke-linecap="round"></path>
</svg>
{%- endmacro %}
