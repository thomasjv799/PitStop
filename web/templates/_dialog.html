{# One document-action dialog per page, filled from whichever cell was
   clicked. `back` is where the action redirects when it is done. #}
<div class="backdrop" id="doc-dialog" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title"><span data-slot="label"></span></h2>
    <p class="dialog-sub">
      <span data-slot="state"></span><br>
      <span class="muted" data-slot="ladder"></span>
    </p>

    <form method="post" data-form="renew">
      <input type="hidden" name="field" data-slot="field">
      <input type="hidden" name="back" value="{{ back }}">
      <div class="field">
        <label for="dlg-date">New expiry date</label>
        <input class="input" type="date" id="dlg-date" name="new_date" required>
      </div>
      <div class="dialog-actions">
        <button class="btn" type="button" data-action="close">Cancel</button>
        <button class="btn btn-primary" type="submit">Renew</button>
      </div>
    </form>

    <form method="post" data-form="snooze" style="border-top:1px solid var(--border);padding-top:16px;margin-top:16px">
      <input type="hidden" name="field" data-slot="field">
      <input type="hidden" name="back" value="{{ back }}">
      <div class="field">
        <label>Or pause reminders</label>
        <div class="seg">
          {% for value, label in snooze_options %}
          <label class="seg-opt">
            <input type="radio" name="duration" value="{{ value }}" {% if loop.first %}checked{% endif %}>{{ label }}
          </label>
          {% endfor %}
        </div>
      </div>
      <div class="field">
        <label for="dlg-reason">Reason</label>
        <input class="input" type="text" id="dlg-reason" name="reason" placeholder="e.g. vehicle being sold">
      </div>
      <div class="dialog-actions">
        <button class="btn" type="submit">Snooze</button>
      </div>
    </form>

    <form method="post" data-form="unsnooze" style="border-top:1px solid var(--border);padding-top:16px;margin-top:16px" hidden>
      <input type="hidden" name="field" data-slot="field">
      <input type="hidden" name="back" value="{{ back }}">
      <div class="dialog-actions" style="margin:0">
        <button class="btn" type="button" data-action="close">Cancel</button>
        <button class="btn btn-primary" type="submit">Resume reminders</button>
      </div>
    </form>
  </div>
</div>
